server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

spring:
  application:
    name: common-foundation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/common_foundation}
    username: ${SPRING_DATASOURCE_USERNAME:common_foundation}
    password: ${SPRING_DATASOURCE_PASSWORD:common_foundation}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MINIMUM_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "${MAIL_SMTP_AUTH:false}"
          starttls:
            enable: "${MAIL_SMTP_STARTTLS_ENABLE:false}"

app:
  mail:
    verification:
      from: "${MAIL_FROM:noreply@example.edu}"
      base-url: "${MAIL_VERIFICATION_BASE_URL:http://localhost:3000}"
      subject: "${MAIL_VERIFICATION_SUBJECT:이메일 인증을 완료해주세요}"

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: kr.ac.knue.commonfoundation
  configuration:
    map-underscore-to-camel-case: true

privacy:
  crypto:
    aes256-gcm-key: "${PRIVACY_CRYPTO_KEY:}"
    hmac-key: "${PRIVACY_HMAC_KEY:${PRIVACY_CRYPTO_KEY:}}"

neis:
  open-api-key: "${NEIS_OPEN_API_KEY:}"
  timeout: ${NEIS_TIMEOUT:PT5S}
  school-info:
    endpoint: ${NEIS_SCHOOL_INFO_ENDPOINT:https://open.neis.go.kr/hub/schoolInfo}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

report:
  policy:
    # OQ-54-01: reviewer 결정 전 0은 자동 만료/삭제 미적용을 의미한다.
    result-file-retention-days: "${REPORT_RESULT_FILE_RETENTION_DAYS:0}"
    # OQ-54-02: 사용자/조직/역할 권한 병합 정책은 설정으로만 격리한다.
    permission-merge-strategy: "${REPORT_PERMISSION_MERGE_STRATEGY:ANY_ALLOW}"
    # OQ-54-03: 권한 밖 대상 일부 포함 시 처리 정책은 reviewer 결정 전 작업 거부를 유지한다.
    unauthorized-bulk-target-policy: "${REPORT_UNAUTHORIZED_BULK_TARGET_POLICY:REJECT_JOB}"
    # OQ-54-04: 실패 출력 시도 이력 기록 여부는 확정 전 설정으로만 제어한다.
    record-failed-print-history: "${REPORT_RECORD_FAILED_PRINT_HISTORY:true}"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/common_foundation}
    username: ${SPRING_DATASOURCE_USERNAME:common_foundation}
    password: ${SPRING_DATASOURCE_PASSWORD:common_foundation}
  mail:
    host: "${MAIL_HOST:mailhog}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  mail:
    verification:
      base-url: "${MAIL_VERIFICATION_BASE_URL:http://localhost:3000}"

server:
  servlet:
    session:
      cookie:
        secure: false

---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: "${MAIL_HOST:}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "${MAIL_SMTP_AUTH:true}"
          starttls:
            enable: "${MAIL_SMTP_STARTTLS_ENABLE:true}"

app:
  mail:
    verification:
      base-url: "${MAIL_VERIFICATION_BASE_URL:https://example.edu}"

server:
  servlet:
    session:
      cookie:
        secure: true
