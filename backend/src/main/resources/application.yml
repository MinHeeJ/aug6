server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false

spring:
  application:
    name: common-foundation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/common_foundation}
    username: ${SPRING_DATASOURCE_USERNAME:common_foundation}
    password: ${SPRING_DATASOURCE_PASSWORD:common_foundation}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MINIMUM_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: kr.ac.knue.commonfoundation
  configuration:
    map-underscore-to-camel-case: true

privacy:
  crypto:
    aes256-gcm-key: "${PRIVACY_CRYPTO_KEY:}"
    hmac-key: "${PRIVACY_HMAC_KEY:${PRIVACY_CRYPTO_KEY:}}"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/common_foundation}
    username: ${SPRING_DATASOURCE_USERNAME:common_foundation}
    password: ${SPRING_DATASOURCE_PASSWORD:common_foundation}

server:
  servlet:
    session:
      cookie:
        secure: false

---
spring:
  config:
    activate:
      on-profile: prod

server:
  servlet:
    session:
      cookie:
        secure: true
