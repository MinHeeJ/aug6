components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly SameSite=Lax session cookie
  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data: {}
        meta:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      required:
        - success
        - meta
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
        meta:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required:
        - loginId
        - password
      properties:
        loginId:
          type: string
        password:
          type: string
    UpdateUserAccountRequest:
      type: object
      required:
        - systemUseYn
        - changeReason
      properties:
        systemUseYn:
          $ref: '#/components/schemas/SystemUseYnEnum'
        changeReason:
          type: string
    UpdateUserRolesRequest:
      type: object
      required:
        - roleCodes
        - changeReason
      properties:
        roleCodes:
          type: array
          items:
            $ref: '#/components/schemas/RoleCodeEnum'
        validStartDate:
          type: string
          format: date
        validEndDate:
          type: string
          format: date
        changeReason:
          type: string
    OrganizationParentRelationRequest:
      type: object
      required:
        - parentOrganizationCode
        - effectiveStartDate
        - changeReason
      properties:
        parentOrganizationCode:
          type: string
        effectiveStartDate:
          type: string
          format: date
        effectiveEndDate:
          type: string
          format: date
          nullable: true
        changeReason:
          type: string
