        - 'auth: 인증 없는 로그아웃 요청 -> 401 ApiError가 반환된다'
        - 'validation: 필수 field 누락 로그아웃 요청 -> 해당 field-level ApiError가 반환된다'
        - 'business: 로그아웃 업무 규칙 위반 -> 기존 상태가 변경되지 않는다'
        - 'side-effect: 로그아웃 성공 -> 변경 처리자와 처리일시가 관련 row에 남는다'
