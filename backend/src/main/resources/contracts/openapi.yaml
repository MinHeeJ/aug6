components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly SameSite=Lax session cookie
  schemas:
    ApiResponse:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        data: {}
        meta:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: array
              items:
                $ref: '#/components/schemas/ValidationError'
        meta:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    FunctionPermissionRequest:
      type: object
      required:
      - screenId
      - roleCode
      - functionType
      - permissionAllowed
      - changeReason
      properties:
        screenId:
          type: string
        roleCode:
          $ref: '#/components/schemas/RoleCodeEnum'
        functionType:
          type: string
          enum:
          - READ
          - CREATE
          - UPDATE
          - DELETE
          - EXECUTE
        permissionAllowed:
          type: string
          enum:
          - ALLOW
          - DENY
        changeReason:
          type: string
    FunctionPermissionEvaluateRequest:
      type: object
      required:
      - screenId
      - roleCode
      - functionType
      - targetDataStatus
      properties:
        screenId:
          type: string
        roleCode:
          $ref: '#/components/schemas/RoleCodeEnum'
        functionType:
          type: string
          enum:
          - READ
          - CREATE
          - UPDATE
          - DELETE
          - EXECUTE
        targetDataStatus:
          type: string
        dataScopeRef:
          type: string
    PeriodPermissionRequest:
      type: object
      required:
      - businessPeriodId
      - functionPermissionId
      - effectiveStartAt
      - changeReason
      properties:
        businessPeriodId:
          type: string
        functionPermissionId:
          type: integer
          format: int64
        effectiveStartAt:
          type: string
          format: date-time
        effectiveEndAt:
          type: string
          format: date-time
          nullable: true
        changeReason:
          type: string
    TemporaryPermissionRequest:
      type: object
      required:
      - userId
      - workDataRef
      - functionType
      - validStartAt
      - validEndAt
      - changeReason
      properties:
        userId:
          type: integer
          format: int64
        workDataRef:
          type: string
        functionType:
          type: string
          enum:
          - READ
          - CREATE
          - UPDATE
          - DELETE
          - EXECUTE
        validStartAt:
          type: string
          format: date-time
        validEndAt:
          type: string
          format: date-time
        changeReason:
          type: string
    PrivacyFieldPolicySaveRequest:
