        - R04
        - R05
        - R06
        - R07
        - R08
        - R09
      x-business-rules:
        - 인증 API 요구의 입력 필드는 서버에서 검증한다
        - 인증된 R09 관리자만 로그아웃 요청을 수행할 수 있다
      x-side-effects:
