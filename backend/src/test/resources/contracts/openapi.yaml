openapi: 3.0.3
info:
  title: 프로젝트 생성 공통기능 API
  version: 1.0.0
  description: 한국교원대학교 교수업적평가시스템 공통기능 1차 범위 HTTP API 계약
servers:
  - url: /
    description: 상대경로 /api 사용 계약
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태 확인
      responses:
        '200':
          description: 상태 확인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      x-related-requirements:
        - REQ-070
        - REQ-088
        - REQ-091
        - REQ-101
        - REQ-102
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 요청 검증 오류
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      error:
                        $ref: '#/components/schemas/ApiError'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      error:
                        $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      error:
                        $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-related-requirements:
        - REQ-075
        - REQ-093
        - REQ-098
        - REQ-070
        - REQ-071
        - REQ-094
        - REQ-097
        - REQ-102
        - REQ-078
        - REQ-088
        - REQ-091
      x-business-rules:
        - 인증 API 요구의 입력 필드는 서버에서 검증한다
        - 인증된 R09 관리자만 로그인 요청을 수행할 수 있다
      x-side-effects:
        - 로그인 결과를 관련 table에 저장하고 변경 메타정보를 기록한다
      x-state-transitions:
        - 'sessions: none -> ACTIVE'
      x-required-tests:
        - 'happy: 유효한 로그인 요청 -> 후속 조회에서 REQ-075 관련 table 변경값이 확인된다'
        - 'auth: 인증 없는 로그인 요청 -> 401 ApiError가 반환된다'
        - 'validation: 필수 field 누락 로그인 요청 -> 해당 field-level ApiError가 반환된다'
        - 'business: 로그인 업무 규칙 위반 -> 기존 상태가 변경되지 않는다'
        - 'side-effect: 로그인 성공 -> 변경 처리자와 처리일시가 관련 row에 남는다'
