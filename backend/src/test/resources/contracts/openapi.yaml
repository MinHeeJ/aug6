components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly SameSite=Lax session cookie
  schemas:
    SchoolInfoSearchResponse:
      type: object
      properties:
        schools:
          type: array
          items:
            $ref: '#/components/schemas/SchoolInfoRow'
    SchoolInfoRow:
      type: object
      properties:
        schoolName: { type: string }
        educationOfficeCode: { type: string }
    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    BusinessTransitionRequest:
      type: object
      required: [actionType]
      properties:
        actionType: { type: string }
        reasonCode: { type: string }
        opinion: { type: string }
        evidenceRef: { type: string }
    ObjectionOpinionRequest:
      type: object
      required: [decisionResult, reviewerOpinion]
      properties:
        decisionResult: { type: string }
        reviewerOpinion: { type: string }
        reasonCode: { type: string }
    ApiResponse:
      type: object
      required: [success, meta]
      properties:
        success: { type: boolean }
        data: { nullable: true }
        meta: { type: object, additionalProperties: true }
    ApiError:
      type: object
      required: [success, meta]
      properties:
        success: { type: boolean }
        message: { type: string }
        fields: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
    SessionTerminateRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    UploadTemplateSaveRequest:
      type: object
      required: [businessType, templateVersion, effectiveDate, requiredColumns, columnOrder, codeRuleRefs]
      properties:
        businessType: { type: string }
        templateVersion: { type: string }
        effectiveDate: { type: string, format: date }
        requiredColumns: { type: array, items: { type: string } }
        columnOrder: { type: array, items: { type: string } }
        codeRuleRefs: { type: array, items: { type: string } }
        fileToken: { type: string }
    ExcelUploadRequest:
      type: object
      required: [businessType, file]
      properties:
        businessType: { type: string }
        templateId: { type: string }
        file: { type: string, format: binary }
    ExcelDownloadRequest:
      type: object
      required: [outputType, queryCondition]
      properties:
        outputType: { type: string, enum: [TARGET, STATUS, ERROR] }
        queryCondition: { type: object, additionalProperties: true }
    BatchDefinitionRequest:
      type: object
      required: [batchId, batchType, scheduleCycle, ownerUserId]
      properties:
        batchId: { type: string }
        batchType: { type: string }
        scheduleCycle: { type: string }
        predecessorBatchIds: { type: array, items: { type: string } }
        successorBatchIds: { type: array, items: { type: string } }
        parameters: { type: object, additionalProperties: true }
        maxExecutionSeconds: { type: integer }
        ownerUserId: { type: integer, format: int64 }
    BatchExecutionRequest:
      type: object
      required: [batchId, reason]
      properties:
        batchId: { type: string }
        parameters: { type: object, additionalProperties: true }
        reason: { type: string }
    BatchExecutionStatusRequest:
      type: object
      required: [targetStatus, reason]
      properties:
        targetStatus: { type: string, enum: [STOPPED] }
        reason: { type: string }
    BatchRetryRequest:
      type: object
      required: [originalExecutionId, retryReason]
      properties:
        originalExecutionId: { type: string }
        failedItemKey: { type: string }
        retryReason: { type: string }

    SaveEvaluationAreaRequest:
      type: object
      required: [ruleVersionId, areaCode, areaName, sortOrder, activeYn, periodApplyMethod]
      properties: { ruleVersionId: { type: integer, format: int64 }, areaCode: { type: string }, areaName: { type: string }, sortOrder: { type: integer }, activeYn: { type: string, enum: [Y, N] }, periodApplyMethod: { type: string } }
    SaveEvaluationItemRequest:
      type: object
      required: [ruleVersionId, areaCode, itemCode, itemName, scoreApplyMethod, activeYn]
      properties: { ruleVersionId: { type: integer, format: int64 }, areaCode: { type: string }, itemCode: { type: string }, itemName: { type: string }, parentItemCode: { type: string }, scoreApplyMethod: { type: string }, activeYn: { type: string, enum: [Y, N] } }
    SaveEvaluationElementRequest:
      type: object
      required: [ruleVersionId, evaluationYear, itemCode, elementCode, elementName, sortOrder, activeYn]
      properties: { ruleVersionId: { type: integer, format: int64 }, evaluationYear: { type: string }, itemCode: { type: string }, elementCode: { type: string }, elementName: { type: string }, sortOrder: { type: integer }, activeYn: { type: string, enum: [Y, N] } }
    SaveEvaluationManagementItemRequest:
      type: object
      required: [ruleVersionId, elementCode, managementItemCode, managementItemName, teacherEditableYn, requiredYn, dataType, sortOrder, activeYn]
      properties: { ruleVersionId: { type: integer, format: int64 }, elementCode: { type: string }, managementItemCode: { type: string }, managementItemName: { type: string }, teacherEditableYn: { type: string, enum: [Y, N] }, requiredYn: { type: string, enum: [Y, N] }, dataType: { type: string }, sortOrder: { type: integer }, activeYn: { type: string, enum: [Y, N] } }
    SaveAreaElementSystemRequest:
      type: object
      required: [ruleVersionId, areaCode, itemCode, elementCode, targetScope, activeYn]
      properties: { ruleVersionId: { type: integer, format: int64 }, areaCode: { type: string }, itemCode: { type: string }, elementCode: { type: string }, targetScope: { type: string }, activeYn: { type: string, enum: [Y, N] } }
    SaveEvaluationScoreRequest:
      type: object
      required: [ruleVersionId, changeReason]
      properties: { ruleVersionId: { type: integer, format: int64 }, changeReason: { type: string }, payload: { type: object, additionalProperties: true } }
    SaveParticipationRateRequest:
