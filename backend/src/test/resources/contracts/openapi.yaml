        validStartDate: { type: string, format: date }
        validEndDate: { type: string, format: date, nullable: true }
        changeReason: { type: string }
    CommonSettingsRequest:
      type: object
      required: [sessionIdleMinutes, pageSizeDefault, defaultSearchPeriodDays, largeQueryThreshold, longRunningTaskThreshold, changeReason]
      properties:
        sessionIdleMinutes: { type: integer, minimum: 1 }
        pageSizeDefault: { type: integer, enum: [20, 50, 100] }
