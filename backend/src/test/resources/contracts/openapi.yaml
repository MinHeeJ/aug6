components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: HttpOnly SameSite=Lax session cookie
  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data: {}
        meta:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      required:
        - success
        - meta
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: array
              items:
                $ref: '#/components/schemas/ValidationError'
        meta:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    FunctionPermissionRequest:
      type: object
      required: [screenId, roleCode, functionType, permissionAllowed, changeReason]
      properties:
        screenId: { type: string }
        roleCode:
          $ref: '#/components/schemas/RoleCodeEnum'
        functionType: { type: string, enum: [READ, CREATE, UPDATE, DELETE, EXECUTE] }
        permissionAllowed: { type: string, enum: [ALLOW, DENY] }
        changeReason: { type: string }
    FunctionPermissionEvaluateRequest:
      type: object
      required: [screenId, roleCode, functionType, targetDataStatus]
      properties:
        screenId: { type: string }
        roleCode:
          $ref: '#/components/schemas/RoleCodeEnum'
        functionType: { type: string, enum: [READ, CREATE, UPDATE, DELETE, EXECUTE] }
        targetDataStatus: { type: string }
        dataScopeRef: { type: string }
    PeriodPermissionRequest:
      type: object
      required: [businessPeriodId, functionPermissionId, effectiveStartAt, changeReason]
      properties:
        businessPeriodId: { type: string }
        functionPermissionId: { type: integer, format: int64 }
        effectiveStartAt: { type: string, format: date-time }
        effectiveEndAt: { type: string, format: date-time, nullable: true }
        changeReason: { type: string }
    TemporaryPermissionRequest:
      type: object
      required: [userId, workDataRef, functionType, validStartAt, validEndAt, changeReason]
      properties:
        userId: { type: integer, format: int64 }
        workDataRef: { type: string }
        functionType: { type: string, enum: [READ, CREATE, UPDATE, DELETE, EXECUTE] }
        validStartAt: { type: string, format: date-time }
        validEndAt: { type: string, format: date-time }
        changeReason: { type: string }
    Basic22GenericRequest:
      type: object
      additionalProperties: true
      description: BASIC-22 신규 공통 운영기능 요청 payload.
    LoginRequest:
      type: object
      required:
        - loginId
        - password
      properties:
        loginId:
          type: string
        password:
          type: string
    UpdateUserAccountRequest:
      type: object
      required:
        - systemUseYn
        - changeReason
      properties:
        systemUseYn:
          $ref: '#/components/schemas/SystemUseYnEnum'
        changeReason:
          type: string
    UpdateUserRolesRequest:
      type: object
      required:
        - roleCodes
        - changeReason
      properties:
        roleCodes:
          type: array
          items:
            $ref: '#/components/schemas/RoleCodeEnum'
        validStartDate:
          type: string
          format: date
        validEndDate:
          type: string
          format: date
        changeReason:
          type: string
    OrganizationParentRelationRequest:
      type: object
      required:
        - parentOrganizationCode
        - effectiveStartDate
        - changeReason
      properties:
        parentOrganizationCode:
          type: string
        effectiveStartDate:
          type: string
          format: date
        effectiveEndDate:
          type: string
          format: date
          nullable: true
        changeReason:
          type: string
    RoleUpdateRequest:
      type: object
      required:
        - roleName
        - purpose
        - assignmentCriteria
        - defaultDataScope
        - changeReason
      properties:
        roleName:
          type: string
        purpose:
          type: string
        assignmentCriteria:
          type: string
        defaultDataScope:
          type: string
        changeReason:
          type: string
    UserRoleAssignmentRequest:
      type: object
      required:
        - userId
        - roleCode
        - assignmentType
        - validStartDate
      properties:
        userId:
          type: string
        roleCode:
          $ref: '#/components/schemas/RoleCodeEnum'
        assignmentType:
          $ref: '#/components/schemas/AssignmentTypeEnum'
        validStartDate:
          type: string
          format: date
        validEndDate:
          type: string
          format: date
          nullable: true
        changeReason:
          type: string
    RevokeUserRoleRequest:
      type: object
      required:
        - changeReason
      properties:
        changeReason:
          type: string
    MenuPermissionSaveRequest:
      type: object
      required:
        - targetType
        - targetId
        - menuId
        - accessAllowed
      properties:
        targetType:
          $ref: '#/components/schemas/TargetTypeEnum'
        targetId:
          type: string
        menuId:
          type: string
        accessAllowed:
          $ref: '#/components/schemas/AccessAllowedEnum'
        changeReason:
          type: string
    MenuParentUpdateRequest:
      type: object
      required:
