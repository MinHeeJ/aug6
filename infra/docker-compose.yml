services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-common_foundation}
      POSTGRES_USER: ${POSTGRES_USER:-common_foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-common_foundation}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: common-foundation-backend:latest
    pull_policy: build
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-common_foundation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-common_foundation}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-common_foundation}
      PRIVACY_CRYPTO_KEY: ${PRIVACY_CRYPTO_KEY:-}
      PRIVACY_HMAC_KEY: ${PRIVACY_HMAC_KEY:-}
      NEIS_OPEN_API_KEY: ${NEIS_OPEN_API_KEY:-}
      NEIS_TIMEOUT: ${NEIS_TIMEOUT:-PT5S}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_VERIFIED_ALIAS: ${MAIL_FROM_VERIFIED_ALIAS:-false}
      MAIL_VERIFICATION_BASE_URL: ${MAIL_VERIFICATION_BASE_URL:-}
      MAIL_CONNECT_TIMEOUT: ${MAIL_CONNECT_TIMEOUT:-5s}
      MAIL_READ_TIMEOUT: ${MAIL_READ_TIMEOUT:-5s}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT:-5s}
      MAIL_CONNECT_TIMEOUT_MS: ${MAIL_CONNECT_TIMEOUT_MS:-5000}
      MAIL_READ_TIMEOUT_MS: ${MAIL_READ_TIMEOUT_MS:-5000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-5000}
      EMAIL_VERIFICATION_RESEND_THROTTLE_SECONDS: ${EMAIL_VERIFICATION_RESEND_THROTTLE_SECONDS:-60}
      EMAIL_VERIFICATION_RESEND_EMAIL_HOURLY_LIMIT: ${EMAIL_VERIFICATION_RESEND_EMAIL_HOURLY_LIMIT:-5}
      EMAIL_VERIFICATION_RESEND_IP_HOURLY_LIMIT: ${EMAIL_VERIFICATION_RESEND_IP_HOURLY_LIMIT:-20}
      TZ: Asia/Seoul
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: common-foundation-frontend:latest
    pull_policy: build
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
