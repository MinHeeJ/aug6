services:
  neis-stub:
    image: nginx:1.27.3-alpine
    volumes:
      - ./neis-stub.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/hub/schoolInfo >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-common_foundation}
      POSTGRES_USER: ${POSTGRES_USER:-common_foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-common_foundation}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: common-foundation-backend:latest
    pull_policy: build
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-common_foundation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-common_foundation}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-common_foundation}
      PRIVACY_CRYPTO_KEY: ${PRIVACY_CRYPTO_KEY:-}
      PRIVACY_HMAC_KEY: ${PRIVACY_HMAC_KEY:-}
      NEIS_OPEN_API_KEY: ${NEIS_OPEN_API_KEY:-}
      NEIS_TIMEOUT: ${NEIS_TIMEOUT:-PT5S}
      NEIS_SCHOOL_INFO_ENDPOINT: http://neis-stub:8080/hub/schoolInfo
      TZ: Asia/Seoul
    depends_on:
      database:
        condition: service_healthy
      neis-stub:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: common-foundation-frontend:latest
    pull_policy: build
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
